<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Proposal Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#ffffff',
            foreground: '#0f172a',
            card: {
              DEFAULT: '#ffffff',
              foreground: '#0f172a'
            },
            popover: {
              DEFAULT: '#ffffff',
              foreground: '#0f172a'
            },
            primary: {
              DEFAULT: '#2563eb',
              foreground: '#ffffff'
            },
            secondary: {
              DEFAULT: '#f8fafc',
              foreground: '#0f172a'
            },
            muted: {
              DEFAULT: '#f1f5f9',
              foreground: '#64748b'
            },
            accent: {
              DEFAULT: '#eff6ff',
              foreground: '#1e40af'
            },
            destructive: {
              DEFAULT: '#ef4444',
              foreground: '#ffffff'
            },
            border: '#e2e8f0',
            input: '#e2e8f0',
            ring: '#3b82f6',
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
