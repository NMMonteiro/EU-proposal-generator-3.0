<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Proposal Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'rgb(var(--background))',
            foreground: 'rgb(var(--foreground))',
            card: {
              DEFAULT: 'rgb(var(--card))',
              foreground: 'rgb(var(--card-foreground))'
            },
            popover: {
              DEFAULT: 'rgb(var(--popover))',
              foreground: 'rgb(var(--popover-foreground))'
            },
            primary: {
              DEFAULT: 'rgb(var(--primary))',
              foreground: 'rgb(var(--primary-foreground))'
            },
            secondary: {
              DEFAULT: 'rgb(var(--secondary))',
              foreground: 'rgb(var(--secondary-foreground))'
            },
            muted: {
              DEFAULT: 'rgb(var(--muted))',
              foreground: 'rgb(var(--muted-foreground))'
            },
            accent: {
              DEFAULT: 'rgb(var(--accent))',
              foreground: 'rgb(var(--accent-foreground))'
            },
            destructive: {
              DEFAULT: 'rgb(var(--destructive))',
              foreground: 'rgb(var(--destructive-foreground))'
            },
            border: 'rgb(var(--border))',
            input: 'rgb(var(--input))',
            ring: 'rgb(var(--ring))',
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body class="bg-background text-foreground antialiased selection:bg-emerald-100 font-sans">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
